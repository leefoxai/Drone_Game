<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101923"><title>드론 시뮬레이터 · 비행 훈련장</title></head><body><canvas id="scene"></canvas><header><div><p class="eyebrow">DRONE LAB / FLIGHT 01</p><h1>비행 훈련장</h1></div><div class="badges"><span id="mode-badge">쉬운 조종</span><span>240 Hz</span><span id="version">PHYSICS 2</span></div><button id="panel-toggle">설정 접기</button></header><main><section class="flight-hud"><div class="lap-card"><span class="eyebrow">TRAINING LOOP · 5 GATES</span><div id="lap-time">00:00.000</div><div id="gate-progress">다음 게이트 1 / 5</div><small id="best-lap">완료한 랩 없음</small></div><div class="telemetry" id="telemetry"><div><small>고도</small><strong id="altitude">3.00 <em>m</em></strong></div><div><small>속도</small><strong id="speed">0.0 <em>m/s</em></strong></div><div><small>스로틀</small><strong id="throttle-value">40 <em>%</em></strong></div><div><small>배터리</small><strong id="battery">24.7 <em>V</em></strong></div></div><p id="flight-message">방향키로 이동 · W/S 상승/하강</p></section><aside id="controls"><div class="actions"><button id="reset">다시 시작 R</button><button id="pause">일시정지 P</button></div><div class="actions"><button id="camera" data-mode="chase">FPV로 전환 C</button><button id="hover">호버 H</button></div><label>조종 모드<select id="flight-mode"><option value="assisted">쉬운 조종</option><option value="acro">Acro</option></select></label><label>입력 방식<select id="input-source"><option value="keyboard">키보드</option><option value="gamepad">게임패드</option></select></label><p id="control-help" class="help">방향키 이동 · W/S 상승/하강 · A/D 회전</p><details id="input-settings"><summary>조종기 설정</summary><select id="device"><option>연결된 장치 없음</option></select><p id="device-message"></p><div id="axis-settings"></div><p id="raw-axes"></p><button id="calibrate-start">보정 시작</button><button id="calibrate-end">보정 완료</button><button id="save-input">저장</button><p id="input-feedback"></p></details><details open><summary>Rates</summary><label>RC rate <output id="rc-rate-out">0.90</output><input id="rc-rate" type="range" min="0.2" max="2" step="0.05" value="0.9"></label><label>Super rate <output id="super-rate-out">0.50</output><input id="super-rate" type="range" min="0" max="0.85" step="0.05" value="0.5"></label><label>Expo <output id="expo-out">0.20</output><input id="expo" type="range" min="0" max="0.8" step="0.05" value="0.2"></label><p id="max-rate">최대 360 °/s</p></details><details><summary>카메라 · 기체</summary><label>FPV 틸트 <output id="tilt-out">15°</output><input id="tilt" type="range" min="0" max="55" value="15"></label><label>FOV <output id="fov-out">75°</output><input id="fov" type="range" min="50" max="110" value="75"></label><label>질량 <output id="mass-out">0.62 kg</output><input id="mass" type="range" min="0.4" max="1" step="0.01" value="0.62"></label><label>추력 <output id="thrust-out">10.0 N</output><input id="thrust" type="range" min="6" max="16" step="0.5" value="10"></label><label>모터 지연 <output id="motor-lag-out">25 ms</output><input id="motor-lag" type="range" min="10" max="80" step="5" value="25"></label></details><p id="status">3D 장면 준비 중</p></aside><section class="bottom-panel"><select id="graph-axis"><option value="2">롤</option><option value="0">피치</option><option value="1">요</option></select><span id="live-rate">0 °/s</span><span id="live-thrust">0 N</span><div class="graphs"><canvas id="rate-graph" width="480" height="90"></canvas><canvas id="thrust-graph" width="480" height="90"></canvas></div></section><canvas id="minimap" width="220" height="160"></canvas></main><script type="module" src="/src/main.ts"></script></body></html>
